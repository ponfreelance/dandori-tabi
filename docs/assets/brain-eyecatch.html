<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 670px; }
  body {
    font-family: "IPAGothic", sans-serif;
    background: #0f1b2d;
    background-image:
      radial-gradient(1100px 500px at 78% -10%, rgba(56,132,255,0.28), transparent 60%),
      radial-gradient(700px 500px at 8% 120%, rgba(255,138,76,0.20), transparent 55%);
    color: #eef3fb;
    width: 1280px; height: 670px;
    position: relative;
    overflow: hidden;
  }
  .frame { position: absolute; inset: 0; padding: 74px 84px; display: flex; flex-direction: column; }

  .kicker {
    display: inline-flex; align-items: center; gap: 12px;
    font-size: 25px; letter-spacing: 0.14em; color: #9fc0ff;
    font-weight: 700;
  }
  .kicker .dot { width: 12px; height: 12px; border-radius: 50%; background: #ff8a4c; box-shadow: 0 0 18px #ff8a4c; }

  h1 {
    margin-top: 30px;
    font-size: 74px; line-height: 1.18; font-weight: 900;
    letter-spacing: 0.005em;
  }
  h1 .hl { color: #ffcf6b; }
  h1 .strike { position: relative; color: #ff7b7b; }

  .sub {
    margin-top: 44px;
    font-size: 30px; line-height: 1.55; color: #b9c8de; font-weight: 700;
    max-width: 760px;
  }

  /* Height gauge on the right */
  .gauge {
    position: absolute; right: 92px; top: 150px; bottom: 130px; width: 250px;
    border-left: 4px solid rgba(159,192,255,0.45);
  }
  .tick { position: absolute; left: 0; width: 100%; }
  .tick .bar { position: absolute; left: 0; width: 46px; height: 4px; background: rgba(159,192,255,0.55); }
  .tick .lbl { position: absolute; left: 62px; top: -20px; font-size: 27px; font-weight: 800; color: #cdddf6; white-space: nowrap; }

  .tick.need { }
  .tick.need .bar { background: #ffcf6b; width: 200px; height: 6px; box-shadow: 0 0 16px rgba(255,207,107,0.6); }
  .tick.need .lbl { color: #ffcf6b; left: 0; top: -46px; font-size: 30px; }

  .tick.have .bar { background: #ff7b7b; width: 200px; height: 6px; }
  .tick.have .lbl { color: #ff9a9a; left: 0; top: 14px; font-size: 30px; }

  .gap {
    position: absolute; right: 0; width: 132px;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 900; color: #ffcf6b;
  }
  .gap .arrow { position: absolute; left: -6px; top: 0; bottom: 0; border-left: 3px dashed #ffcf6b; }

  .brandrow {
    margin-top: 34px;
    display: flex; align-items: center; gap: 18px;
    font-size: 26px; color: #8fa6c4; font-weight: 800; letter-spacing: 0.04em;
  }
  .pill { padding: 6px 18px; border: 2px solid rgba(159,192,255,0.4); border-radius: 999px; color: #cdddf6; }
</style>
</head>
<body>
  <div class="frame">
    <div class="kicker"><span class="dot"></span>子連れテーマパークの「詰み」を出発前に潰す</div>
    <h1>7歳・120cm。<br><span class="strike">あと2cm</span>で<br><span class="hl">乗れなかった。</span></h1>
    <div class="sub">「候補を足す」のではなく、<br>制約から<strong style="color:#eef3fb">破綻を先に見つける</strong>ソルバーの作り方。</div>
  </div>

  <div class="gauge">
    <div class="tick need" style="top: 60px;">
      <div class="lbl">122cm 必須</div>
      <div class="bar"></div>
    </div>
    <div class="tick have" style="top: 200px;">
      <div class="lbl">120cm 現状</div>
      <div class="bar"></div>
    </div>
    <div class="gap" style="top: 60px; height: 140px;">
      <div class="arrow"></div>2cm
    </div>
  </div>

  <div class="brandrow">
    <span class="pill">無料版あり</span>
    <span>ブラウザで動く制約ソルバー</span>
  </div>
</body>
</html>
